<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Quên mật khẩu</h1>
        <form
          th:action="@{/forgot-password}"
          th:object="${forgotPasswordDTO}"
          method="post"
        >
          <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
          </div>

          <label>Email liên kết tài khoản</label>
          <input
            type="email"
            th:field="*{email}"
            required
            placeholder="Nhập email..."
          />

          <button class="button full mt" type="submit">
            Gửi OTP đặt lại mật khẩu
          </button>
        </form>
        <p><a th:href="@{/login}">Quay lại Login</a></p>
      </div>
    </div>
  </body>
</html>

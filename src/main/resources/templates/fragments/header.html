<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <header th:fragment="header">
      <nav>
        <a th:href="@{/}">UTEShop</a>

        <div sec:authorize="isAuthenticated()">
          <img
            th:src="${#authentication.principal.images != null ? #authentication.principal.images : '/images/avatar-default.png'}"
            alt="Avatar"
          />

          <span th:text="${#authentication.principal.fullName}">Full Name</span>
          <span th:text="'(' + ${#authentication.principal.username} + ')'"
            >(username)</span
          >
          <span th:text="${#authentication.principal.email}"
            >email@example.com</span
          >
          <span th:text="${#authentication.principal.authorities[0].authority}"
            >ROLE</span
          >

          <form th:action="@{/logout}" method="post" style="display: inline">
            <button type="submit">Đăng xuất</button>
          </form>
        </div>

        <div sec:authorize="!isAuthenticated()">
          <a th:href="@{/login}">Đăng nhập</a>
        </div>
      </nav>
    </header>
  </body>
</html>

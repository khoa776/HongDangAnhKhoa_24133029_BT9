<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"
  ></head>
  <body>
    <div th:replace="~{layouts/layout :: page(~{::main})}">
      <main class="form-card">
        <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>
        <form
          th:object="${productDTO}"
          enctype="multipart/form-data"
          method="post"
          th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}"
        >
          <input type="hidden" th:field="*{id}" />

          <label for="name">Tên sản phẩm</label>
          <input id="name" th:field="*{name}" />
          <small class="error-text" th:errors="*{name}"></small>

          <label for="description">Mô tả</label>
          <textarea
            id="description"
            th:field="*{description}"
            rows="4"
          ></textarea>

          <label for="price">Giá</label>
          <input id="price" type="number" step="0.01" th:field="*{price}" />
          <small class="error-text" th:errors="*{price}"></small>

          <label for="image">Ảnh sản phẩm (Cloudinary)</label>
          <input id="image" type="file" name="image" accept="image/*" />

          <div th:if="${productDTO.imageUrl != null}">
            <p>Ảnh hiện tại:</p>
            <img
              th:src="${#strings.contains(productDTO.imageUrl, '|') ? #strings.substringBefore(productDTO.imageUrl, '|') : productDTO.imageUrl}"
              class="preview"
            />
          </div>

          <button type="submit" class="button mt">Lưu</button>
          <a class="button secondary" th:href="@{/products}">Hủy</a>
        </form>
      </main>
    </div>
  </body>
</html>
